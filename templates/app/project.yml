# XcodeGen spec. The .xcodeproj is GENERATED from this file by `mainline gen`;
# never edit the .xcodeproj directly (it is git-ignored).
#
# ${VARIABLES} are expanded from app.env and your mainline settings at generation time.
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: __APP_NAME__

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "${MARKETING_VERSION}"
    CURRENT_PROJECT_VERSION: "1"   # overridden with the real build number by `mainline ship`
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic

targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "${DISPLAY_NAME}"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Answers the TestFlight export-compliance question automatically.
        # Only true if the app uses encryption beyond Apple's OS-provided HTTPS/TLS.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only; "1,2" adds iPad (and iPad screenshots for review)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}.tests"
        GENERATE_INFOPLIST_FILE: YES

  __APP_NAME__UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}.uitests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: __APP_NAME__

schemes:
  __APP_NAME__:
    build:
      targets:
        __APP_NAME__: all
    test:
      config: Debug
      targets:
        - __APP_NAME__Tests
        - __APP_NAME__UITests
    run:
      config: Debug
    archive:
      config: Release
